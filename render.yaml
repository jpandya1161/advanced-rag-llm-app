# Render blueprint. Push this repo, then in the Render dashboard choose
# "New +" -> "Blueprint" and point it at this repository. Render reads this
# file and creates the service automatically.
services:
  - type: web
    name: advanced-rag-llm-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: LLM_PROVIDER
        value: offline
